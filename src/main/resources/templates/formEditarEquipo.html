<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Edit team')"></head>

<body>

<div th:replace="fragments :: menu"></div>

<div class="container mt-4">

    <h2>Edit team</h2>

    <form method="post"
          th:action="@{/equipos/{id}/editar(id=${equipo.id})}">

        <div class="form-group">
            <label for="nombre">Team name</label>

            <input type="text"
                   id="nombre"
                   name="nombre"
                   class="form-control"
                   th:value="${equipo.nombre}"
                   required>
        </div>

        <button type="submit" class="btn btn-primary">
            Save changes
        </button>

        <a class="btn btn-secondary"
           th:href="@{/equipos}">
            Cancel
        </a>

    </form>

</div>

<div th:replace="fragments :: javascript"></div>

</body>
</html>
